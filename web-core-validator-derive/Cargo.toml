[package]
name = "web-core-validator-derive"
version = "0.5.0"
edition = "2024"
description = "Derive crate of web-core's validator crate"
homepage = "https://github.com/Salman-Sali/web-core"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
syn = "2"
quote = "1"
proc-macro2 = "1"
proc-macro-error2 = "2"
darling = { version = "0.20", features = ["suggestions"] }

[features]
nightly_features = ["proc-macro-error2/nightly"]

[package]
name = "web-core-validator"
version = "0.3.0"
homepage = "https://github.com/Keats/validator"
edition = "2024"


[dependencies]
web-core-validator-derive = { version = "0.2.0", path = "../web-core-validator-derive", optional = true }
url = "2"
regex = { version = "1", default-features = false, features = ["std"] }
idna = "1"
serde = "1"
serde_derive = "1"
serde_json = "1"
card-validate = { version = "2.3", optional = true }
indexmap = { version = "2.0.0", features = ["serde"], optional = true }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
trait-variant = "0.1.3"

[features]
card = ["card-validate"]
derive = ["web-core-validator-derive"]
derive_nightly_features = ["derive", "web-core-validator-derive/nightly_features"]

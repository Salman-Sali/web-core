[package]
name = "web-core"
version = "0.5.0"
edition = "2024"
description = "Core utils for Axum projects"
homepage = "https://github.com/Salman-Sali/web-core"
license = "MIT"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.4"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
jsonwebtoken = "9.3.1"
reqwest = {version ="0.12.28", default-features = false, features = ["json", "rustls-tls",  "charset", "http2", "system-proxy"]}
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
strum_macros = "0.27.2"
thiserror = "2.0.16"
tower-http = { version = "0.6.6", features = ["cors"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }
lambda_http = "0.13.0"
http = "1.3.1"
google-oauth = { version =  "1.11.4", default-features = false, features = ["reqwest-rustls" ]}
futures = "0.3.31"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
rand_core = { version = "0.6.0", features = ["getrandom"] }
aws-sdk-sesv2 = { version = "1.111.0", optional = true }
diesel = { version = "2.3.11",  features = ["postgres", "r2d2"], optional = true }
askama = "0.14.0"
diesel_migrations = { version= "2.3.2", optional = true }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"], optional = true }
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"], optional = true }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"] }
phonenumber = "0.3.10"
web-core-derive = { workspace = true, optional = true }
web-core-validator = { workspace = true }
tracing = "0.1.44"
tokio = { version = "1.54.1", features = ["rt", "sync"] }

[features]
default = [ ]
aws = [
    "aws-sdk-sesv2"
]
derive = ["dep:web-core-derive"]
diesel = ["derive", "dep:diesel", "dep:diesel_migrations", "web-core-derive/diesel"]
diesel-async = ["diesel", "dep:diesel-async", "dep:deadpool"]
all = ["aws", "derive", "diesel", "diesel-async"]

[workspace]
members = ["web-core-derive", "web-core-validator", "web-core-validator-derive", "web-core-backup", "web-core-runners"]

[dev-dependencies]
web-core = { path = ".", features = ["all"]}
diesel = { version = "2.3.11", features = ["postgres"] }
diesel_migrations = "2.3.2"
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
web-core-validator = { workspace = true }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[workspace.dependencies]
web-core-derive = { version = "0.5.0", path = "./web-core-derive" }
web-core-validator = { version = "0.5.0", path = "./web-core-validator" }
web-core-validator-derive = { version = "0.5.0", path = "./web-core-validator-derive" }
web-core = { version = "0.5.0", path = "." }
web-core-runners = { version = "0.5.0", path = "./web-core-runners" }
